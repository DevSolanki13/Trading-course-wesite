name: Release verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
      - run: npm run test:purchase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-6-browser-evidence
          path: artifacts/phase-6/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchase-demo-screenshots
          path: artifacts/purchase/results/**/*.png
          retention-days: 7
